<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ウイコレ手持ち管理ツール</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #007bff; color: white; }
  </style>
</head>
<body>

  <h1>ウイコレ手持ちカード自動登録プロトタイプ</h1>

  <div class="card">
    <label>Gemini API Key: </label>
    <input type="password" id="apiKey" placeholder="AI Studioで取得したキーを入力">
    <br><br>
    <input type="file" id="imageInput" accept="image/*" multiple>
    <button onclick="analyzeImage()">スクショを解析して登録</button>
    <p id="status"></p>
  </div>

  <h2>所持カード一覧</h2>
  <table>
    <thead>
      <tr>
        <th>選手名</th>
        <th>グレード</th>
        <th>タイプ</th>
        <th>ポジション</th>
        <th>メインスキル</th>
        <th>セレクトスキル</th>
      </tr>
    </thead>
    <tbody id="cardTable">
      <!-- ここに解析結果が追加されます -->
    </tbody>
  </table>

  <script>
    async function analyzeImage() {
      const apiKey = document.getElementById('apiKey').value;
      const fileInput = document.getElementById('imageInput');
      const status = document.getElementById('status');

      if (!apiKey) return alert('API Keyを入力してください');
      if (fileInput.files.length === 0) return alert('画像を選択してください');

      status.innerText = '解析中...';

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onloadend = async () => {
        const base64Image = reader.result.split(',')[1];
        
        const prompt = `ウイコレのカード画面です。以下の項目をJSON形式で抽出してください。
        {"name": "選手名", "grade": 123, "type": "タイプ", "position": "ポジション", "main_skill": "スキル1", "select_skill": "選択中のセレクトスキル"}`;

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: prompt },
                  { inline_data: { mime_type: file.type, data: base64Image } }
                ]
              }]
            })
          });

          const data = await response.json();
          const textResponse = data.candidates[0].content.parts[0].text;
          const cleanJson = textResponse.replace(/```json|```/g, '').trim();
          const cardData = JSON.parse(cleanJson);

          // テーブルに追加
          const table = document.getElementById('cardTable');
          const row = table.insertRow();
          row.insertCell(0).innerText = cardData.name;
          row.insertCell(1).innerText = cardData.grade;
          row.insertCell(2).innerText = cardData.type;
          row.insertCell(3).innerText = cardData.position;
          row.insertCell(4).innerText = cardData.main_skill;
          row.insertCell(5).innerText = cardData.select_skill;

          status.innerText = '解析完了！';
        } catch (e) {
          console.error(e);
          status.innerText = 'エラーが発生しました。';
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
