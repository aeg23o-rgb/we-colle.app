<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ウイコレ手持ち管理ツール v4.0</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .version-info { font-size: 0.85em; color: #007bff; font-weight: bold; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.8em; }
    th, td { border: 1px solid #ddd; padding: 6px; text-align: center; vertical-align: middle; white-space: pre-wrap; }
    th { background-color: #007bff; color: white; }
    
    /* カード画像部分のみを中心にトリミングして表示する設定 */
    .card-thumb { 
      width: 70px; 
      height: 90px; 
      object-fit: cover; 
      object-position: top center; 
      border-radius: 6px; 
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <h1>ウイコレ手持ちカード自動登録ツール</h1>
  <div class="version-info">バージョン: v4.0 (スキル/センス/ボーナスセンス7枠/適性ポジション対応版)</div>

  <div class="card">
    <label>Gemini API Key: </label>
    <input type="password" id="apiKey" placeholder="AI Studioで取得したキーを入力">
    <button onclick="saveApiKey()">キーを保存</button>
    <span id="keyStatus" style="color: green; font-size: 0.9em; margin-left: 10px;"></span>
    <br><br>
    <p style="font-size: 0.85em; color: #666;">※1選手につき複数枚（最大3枚）のスクショを同時に選択できます</p>
    <input type="file" id="imageInput" accept="image/*" multiple>
    <button onclick="analyzeImages()">スクショを解析して登録</button>
    <p id="status"></p>
  </div>

  <h2>所持カード一覧</h2>
  <table>
    <thead>
      <tr>
        <th>画像</th>
        <th>選手名</th>
        <th>カード種類</th>
        <th>グレード</th>
        <th>タイプ</th>
        <th>ポジション適性</th>
        <th>キラ</th>
        <th>SHOWTIME</th>
        <th>OF</th>
        <th>DF</th>
        <th>TC</th>
        <th>PO</th>
        <th>SP</th>
        <th>ST</th>
        <th>メインスキル(最大3)</th>
        <th>セレクトスキル(最大3)</th>
        <th>センス(最大3)</th>
        <th>ボーナスセンス(最大7枠)</th>
      </tr>
    </thead>
    <tbody id="cardTable">
      <!-- 解析結果追加位置 -->
    </tbody>
  </table>

  <script>
    window.onload = function() {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
        document.getElementById('keyStatus').innerText = '※保存済み';
      }
    };

    function saveApiKey() {
      const key = document.getElementById('apiKey').value;
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        document.getElementById('keyStatus').innerText = '※保存しました！';
      } else {
        localStorage.removeItem('gemini_api_key');
        document.getElementById('keyStatus').innerText = '';
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function analyzeImages() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const fileInput = document.getElementById('imageInput');
      const status = document.getElementById('status');

      if (!apiKey) return alert('API Keyを入力してください');
      if (fileInput.files.length === 0) return alert('画像を選択してください');

      status.innerText = `${fileInput.files.length}枚の画像を詳細解析中...`;

      try {
        const parts = [];
        let previewDataUrl = '';

        const promptText = `提供されたウイコレのスクリーンショット画像（最大3枚）から情報を読み取り、以下の項目を正確に抽出して指定のJSONフォーマットのみを出力してください。余計な説明文は含めないでください。

【注意・抽出仕様】
1. main_skills: メインスキルを最大3つまで配列で抽出。
2. select_skills: セレクトスキル（選択中のものや所持しているもの）を最大3つまで配列で抽出。
3. senses: 所持・装着しているセンスを最大3つまで配列で抽出。
4. bonus_senses: ボーナスセンス（Lv1で2枠、Lv2で2枠、Lv3で3枠の最大7枠）の解放・適用状況を配列（文字列のリスト）で抽出。
5. position: 本適性（濃い色）と薄適性（薄い色）を区別して、「本適性: OMF, CMF / 薄適性: DMF」のような形式で記載。

JSONフォーマット:
{
  "name": "選手名",
  "card_type": "カード種別",
  "grade": "グレード数値",
  "type": "タイプ",
  "position": "本適性: OMF, CMF / 薄適性: DMF",
  "is_kira": "あり/なし",
  "showtime": "あり/なし",
  "offence": "OF数値",
  "defence": "DF数値",
  "technique": "TC数値",
  "power": "PO数値",
  "speed": "SP数値",
  "stamina": "ST数値",
  "main_skills": ["スキル1", "スキル2", "スキル3"],
  "select_skills": ["スキル1", "スキル2", "スキル3"],
  "senses": ["センス1", "センス2", "センス3"],
  "bonus_senses": ["Lv1: xx", "Lv1: xx", "Lv2: xx", "Lv2: xx", "Lv3: xx", "Lv3: xx", "Lv3: xx"]
}`;

        parts.push({ text: promptText });

        for (let i = 0; i < fileInput.files.length; i++) {
          const file = fileInput.files[i];
          const dataUrl = await fileToBase64(file);
          if (i === 0) previewDataUrl = dataUrl;

          parts.push({
            inline_data: {
              mime_type: file.type || 'image/jpeg',
              data: dataUrl.split(',')[1]
            }
          });
        }

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: parts }] })
        });

        const resData = await response.json();

        if (resData.error) {
          throw new Error(`APIエラー (${resData.error.code}): ${resData.error.message}`);
        }

        const rawText = resData.candidates[0].content.parts[0].text;
        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        if (!jsonMatch) {
          throw new Error('解析結果の取得に失敗しました。');
        }

        const card = JSON.parse(jsonMatch[0]);

        // 配列データを改行テキストに変換
        const mainSkillsStr = Array.isArray(card.main_skills) ? card.main_skills.join('\n') : (card.main_skills || '-');
        const selectSkillsStr = Array.isArray(card.select_skills) ? card.select_skills.join('\n') : (card.select_skills || '-');
        const sensesStr = Array.isArray(card.senses) ? card.senses.join('\n') : (card.senses || '-');
        const bonusSensesStr = Array.isArray(card.bonus_senses) ? card.bonus_senses.join('\n') : (card.bonus_senses || '-');

        const table = document.getElementById('cardTable');
        const row = table.insertRow();
        row.innerHTML = `
          <td><img src="${previewDataUrl}" class="card-thumb"></td>
          <td><b>${card.name || '-'}</b></td>
          <td>${card.card_type || '-'}</td>
          <td>${card.grade || '-'}</td>
          <td>${card.type || '-'}</td>
          <td style="text-align:left;">${card.position || '-'}</td>
          <td>${card.is_kira || '-'}</td>
          <td>${card.showtime || '-'}</td>
          <td>${card.offence || '-'}</td>
          <td>${card.defence || '-'}</td>
          <td>${card.technique || '-'}</td>
          <td>${card.power || '-'}</td>
          <td>${card.speed || '-'}</td>
          <td>${card.stamina || '-'}</td>
          <td style="text-align:left;">${mainSkillsStr}</td>
          <td style="text-align:left;">${selectSkillsStr}</td>
          <td style="text-align:left;">${sensesStr}</td>
          <td style="text-align:left;">${bonusSensesStr}</td>
        `;

        status.innerText = '解析完了！';
      } catch (e) {
        console.error(e);
        status.innerText = 'エラー詳細: ' + e.message;
      }
    }
  </script>
</body>
</html>
