<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ウイコレ手持ち管理ツール v1.3</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .version-info { font-size: 0.85em; color: #007bff; font-weight: bold; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85em; }
    th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
    th { background-color: #007bff; color: white; }
    .card-thumb { width: 60px; height: auto; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>ウイコレ手持ちカード自動登録ツール</h1>
  <div class="version-info">バージョン: v1.3 (モデル名修正版)</div>

  <div class="card">
    <label>Gemini API Key: </label>
    <input type="password" id="apiKey" placeholder="AI Studioで取得したキーを入力">
    <button onclick="saveApiKey()">キーを保存</button>
    <span id="keyStatus" style="color: green; font-size: 0.9em; margin-left: 10px;"></span>
    <br><br>
    <p style="font-size: 0.85em; color: #666;">※1選手につき複数枚（3枚まで）のスクショを同時に選択可能です</p>
    <input type="file" id="imageInput" accept="image/*" multiple>
    <button onclick="analyzeImages()">スクショを解析して登録</button>
    <p id="status"></p>
  </div>

  <h2>所持カード一覧</h2>
  <table>
    <thead>
      <tr>
        <th>画像</th>
        <th>選手名</th>
        <th>カード種類</th>
        <th>グレード</th>
        <th>タイプ</th>
        <th>ポジ</th>
        <th>キラ</th>
        <th>SHOWTIME</th>
        <th>OF</th>
        <th>DF</th>
        <th>TC</th>
        <th>PO</th>
        <th>SP</th>
        <th>ST</th>
        <th>メインスキル</th>
        <th>セレクトスキル</th>
      </tr>
    </thead>
    <tbody id="cardTable">
      <!-- ここに解析結果が追加されます -->
    </tbody>
  </table>

  <script>
    window.onload = function() {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
        document.getElementById('keyStatus').innerText = '※保存済み';
      }
    };

    function saveApiKey() {
      const key = document.getElementById('apiKey').value;
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        document.getElementById('keyStatus').innerText = '※保存しました！';
      } else {
        localStorage.removeItem('gemini_api_key');
        document.getElementById('keyStatus').innerText = '';
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function analyzeImages() {
      const apiKey = document.getElementById('apiKey').value;
      const fileInput = document.getElementById('imageInput');
      const status = document.getElementById('status');

      if (!apiKey) return alert('API Keyを入力してください');
      if (fileInput.files.length === 0) return alert('画像を選択してください');

      status.innerText = `${fileInput.files.length}枚の画像を解析中...`;

      try {
        const imageParts = [];
        let previewDataUrl = '';

        for (let i = 0; i < fileInput.files.length; i++) {
          const file = fileInput.files[i];
          const dataUrl = await fileToBase64(file);
          if (i === 0) previewDataUrl = dataUrl;
          
          imageParts.push({
            inline_data: {
              mime_type: file.type,
              data: dataUrl.split(',')[1]
            }
          });
        }

        const prompt = `提供されたウイコレの画像群から情報を抽出し、以下のフォーマットのJSONのみを出力してください。
        {
          "name": "選手名",
          "card_type": "カード種別（レギュラー, ナショナル, レジェンドなど）",
          "grade": 123,
          "type": "タイプ（テクニック, パワーなど）",
          "position": "ポジション",
          "is_kira": "あり/なし",
          "showtime": "あり/なし",
          "offence": 1000,
          "defence": 1000,
          "technique": 1000,
          "power": 1000,
          "speed": 1000,
          "stamina": 1000,
          "main_skill": "メインスキル名",
          "select_skill": "選択中のセレクトスキル名（なければ『なし』）"
        }`;

        const requestBody = {
          contents: [{ parts: [{ text: prompt }, ...imageParts] }]
        };

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const textResponse = data.candidates[0].content.parts[0].text;
        const cleanJson = textResponse.replace(/```json|```/g, '').trim();
        const card = JSON.parse(cleanJson);

        const table = document.getElementById('cardTable');
        const row = table.insertRow();
        row.innerHTML = `
          <td><img src="${previewDataUrl}" class="card-thumb"></td>
          <td><b>${card.name || '-'}</b></td>
          <td>${card.card_type || '-'}</td>
          <td>${card.grade || '-'}</td>
          <td>${card.type || '-'}</td>
          <td>${card.position || '-'}</td>
          <td>${card.is_kira || '-'}</td>
          <td>${card.showtime || '-'}</td>
          <td>${card.offence || '-'}</td>
          <td>${card.defence || '-'}</td>
          <td>${card.technique || '-'}</td>
          <td>${card.power || '-'}</td>
          <td>${card.speed || '-'}</td>
          <td>${card.stamina || '-'}</td>
          <td>${card.main_skill || '-'}</td>
          <td>${card.select_skill || '-'}</td>
        `;

        status.innerText = '解析完了！';
      } catch (e) {
        console.error(e);
        status.innerText = 'エラー詳細: ' + e.message;
      }
    }
  </script>
</body>
</html>
