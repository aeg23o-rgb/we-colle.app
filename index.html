<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ウイコレ手持ち管理ツール</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #007bff; color: white; }
  </style>
</head>
<body>

  <h1>ウイコレ手持ちカード自動登録プロトタイプ</h1>

  <div class="card">
    <label>Gemini API Key: </label>
    <input type="password" id="apiKey" placeholder="AI Studioで取得したキーを入力">
    <button onclick="saveApiKey()">キーを保存</button>
    <span id="keyStatus" style="color: green; font-size: 0.9em; margin-left: 10px;"></span>
    <br><br>
    <p style="font-size: 0.85em; color: #666;">※1選手につき複数枚（3枚まで）のスクショを同時に選択できます</p>
    <input type="file" id="imageInput" accept="image/*" multiple>
    <button onclick="analyzeImages()">スクショを解析して登録</button>
    <p id="status"></p>
  </div>

  <h2>所持カード一覧</h2>
  <table>
    <thead>
      <tr>
        <th>選手名</th>
        <th>グレード</th>
        <th>タイプ</th>
        <th>ポジション</th>
        <th>メインスキル</th>
        <th>セレクトスキル</th>
      </tr>
    </thead>
    <tbody id="cardTable">
      <!-- ここに解析結果が追加されます -->
    </tbody>
  </table>

  <script>
    window.onload = function() {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
        document.getElementById('keyStatus').innerText = '※保存済み';
      }
    };

    function saveApiKey() {
      const key = document.getElementById('apiKey').value;
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        document.getElementById('keyStatus').innerText = '※保存しました！';
      } else {
        localStorage.removeItem('gemini_api_key');
        document.getElementById('keyStatus').innerText = '';
      }
    }

    // 画像ファイルをBase64に変換する関数
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function analyzeImages() {
      const apiKey = document.getElementById('apiKey').value;
      const fileInput = document.getElementById('imageInput');
      const status = document.getElementById('status');

      if (!apiKey) return alert('API Keyを入力してください');
      if (fileInput.files.length === 0) return alert('画像を選択してください');

      status.innerText = `${fileInput.files.length}枚の画像を解析中...`;

      try {
        // 選択されたすべての画像をBase64形式に変換
        const imageParts = [];
        for (let i = 0; i < fileInput.files.length; i++) {
          const file = fileInput.files[i];
          const base64Data = await fileToBase64(file);
          imageParts.push({
            inline_data: {
              mime_type: file.type,
              data: base64Data
            }
          });
        }

        const prompt = `提供された複数の画像（同じウイコレ選手の詳細画面スクショ）から情報を統合し、以下の項目を正確にJSON形式で抽出してください。
        {"name": "選手名", "grade": 123, "type": "タイプ", "position": "ポジション", "main_skill": "メインスキル名", "select_skill": "選択中のセレクトスキル名"}`;

        // リクエストの組み立て（プロンプトテキスト + 複数画像データ）
        const requestBody = {
          contents: [{
            parts: [
              { text: prompt },
              ...imageParts
            ]
          }]
        };

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();
        if (data.error) {
          throw new Error(data.error.message || 'APIエラーが発生しました');
        }

        const textResponse = data.candidates[0].content.parts[0].text;
        const cleanJson = textResponse.replace(/```json|```/g, '').trim();
        const cardData = JSON.parse(cleanJson);

        // テーブルに追加
        const table = document.getElementById('cardTable');
        const row = table.insertRow();
        row.insertCell(0).innerText = cardData.name || '-';
        row.insertCell(1).innerText = cardData.grade || '-';
        row.insertCell(2).innerText = cardData.type || '-';
        row.insertCell(3).innerText = cardData.position || '-';
        row.insertCell(4).innerText = cardData.main_skill || '-';
        row.insertCell(5).innerText = cardData.select_skill || '-';

        status.innerText = '解析完了！';
      } catch (e) {
        console.error(e);
        status.innerText = 'エラー詳細: ' + e.message;
      }
    }
  </script>
</body>
</html>
